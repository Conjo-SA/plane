<!-- templates/csrf_failure.html -->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falha na verificação CSRF</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
        padding: 50px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        max-width: 400px;
        padding: 30px;
        background-color: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .card-header {
        text-align: center;
        margin-bottom: 20px;
      }
      .btn-primary {
        display: block;
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        color: #fff;
        text-align: center;
        text-decoration: none;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn-primary:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <h3>Falha na verificação CSRF</h3>
      </div>
      <div class="card-body">
        <p>
          Parece que o envio do formulário expirou ou houve um problema
          com a sua solicitação.
        </p>
        <p>Tente o seguinte:</p>
        <ul>
          <li>Atualize a página e tente enviar o formulário novamente.</li>
          <li>Verifique se os cookies estão habilitados no seu navegador.</li>
        </ul>
        <a href="{{ root_url }}" class="btn-primary">Ir para a página inicial</a>
      </div>
    </div>
  </body>
</html>
